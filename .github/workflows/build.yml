name: Build FrostSynth (Windows)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE downloaden
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configureren
        run: cmake -B build -A x64
      - name: Bouwen
        run: cmake --build build --config Release --target FrostSynth_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: FrostSynth-VST3-Windows
          path: build/FrostSynth_artefacts/Release/VST3/FrostSynth.vst3
